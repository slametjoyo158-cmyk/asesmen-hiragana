        body {

            color: #0f172a;

        .font-jp {

        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Smooth scale animation */
        .card-hover {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card-hover:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);

    </main>

    <!-- Modal Pop-up Kartu & Penulisan Huruf -->

                <!-- Large Character & Audio -->

                    <div class="bg-white border-2 border-slate-200 rounded-2xl p-4 flex flex-col items-center justify-center relative overflow-hidden shadow-inner">

        // Utility: Fisher-Yates Shuffle
        function shuffle(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ja-JP';
                utterance.rate = 0.8;
                window.speechSynthesis.speak(utterance);
            }

            const badgesLayer = document.getElementById('stroke-badges-layer');

            speakHiragana(item.char);

        function nextStrokeStep() {
            if (!state.currentActiveChar) return;
            const total = state.currentActiveChar.strokes;
            currentStrokeStep = (currentStrokeStep + 1) % (total + 1);
            updateStrokeStepUI();
        }

        function prevStrokeStep() {
            if (!state.currentActiveChar) return;
            const total = state.currentActiveChar.strokes;
            currentStrokeStep = (currentStrokeStep - 1 + total + 1) % (total + 1);
            updateStrokeStepUI();
        }

        function updateStrokeStepUI() {
            const indicator = document.getElementById('stroke-step-indicator');
            const badges = document.querySelectorAll('#stroke-badges-layer div');

            if (!state.currentActiveChar) return;

            if (currentStrokeStep === 0) {
                if (indicator) indicator.innerText = `Semua ${state.currentActiveChar.strokes} Goresan`;
                badges.forEach(b => b.style.opacity = '1');
            } else {
                if (indicator) indicator.innerText = `Langkah Goresan ${currentStrokeStep}`;
                badges.forEach((b, idx) => {
                    b.style.opacity = (idx + 1) === currentStrokeStep ? '1' : '0.2';
                });
            }
        }

        // ==========================================
        // MODUL ASESMEN UJIAN (60 SOAL)
        // ==========================================
        function generate60Questions() {
            const basicPool = shuffle(hiraganaData.filter(d => d.type === 'basic')).slice(0, 30);
            const dakuonPool = shuffle(hiraganaData.filter(d => d.type === 'dakuon')).slice(0, 15);
            const handakuonPool = shuffle(hiraganaData.filter(d => d.type === 'handakuon')).slice(0, 5);
            const yoonPool = shuffle(hiraganaData.filter(d => d.type === 'yoon')).slice(0, 10);

            return shuffle([...basicPool, ...dakuonPool, ...handakuonPool, ...yoonPool]);
        }

        function generateOptions(correctRomaji) {
            const allRomaji = Array.from(new Set(hiraganaData.map(d => d.romaji))).filter(r => r !== correctRomaji);
            const distractors = shuffle(allRomaji).slice(0, 4);
            const options = shuffle([correctRomaji, ...distractors]);
            const labels = ['A', 'B', 'C', 'D', 'E'];

            return options.map((val, idx) => ({
                label: labels[idx],
                value: val
            }));
        }

        function initializeQuiz() {
            const questions = generate60Questions();
            state.soalQuiz = questions.map(q => ({
                ...q,
                options: generateOptions(q.romaji),
                userAnswer: null
            }));
            state.skor = 0;
            state.soalSaatIni = 0;
            state.isJawabanDiberi = false;
        }

        function handleAnswer(selectedValue, buttonEl) {
            if (state.isJawabanDiberi) return;

            clearTimeout(state.timerTimeout);
            state.isJawabanDiberi = true;
            
            const current = state.soalQuiz[state.soalSaatIni];
            const isCorrect = selectedValue === current.romaji;
            const feedbackArea = document.getElementById('feedback-area');

            // Nonaktifkan semua tombol
            const buttons = document.querySelectorAll('#options-container button');
            buttons.forEach(b => b.disabled = true);

            if (isCorrect) {
                state.skor++;
                buttonEl.classList.add('bg-emerald-500', 'text-white', 'border-emerald-500');
                feedbackArea.innerHTML = `<div class="p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-xl font-bold text-sm">Jawaban Benar! 🎉</div>`;
            } else {
                buttonEl.classList.add('bg-red-500', 'text-white', 'border-red-500');
                feedbackArea.innerHTML = `<div class="p-3 bg-red-50 border border-red-200 text-red-700 rounded-xl font-bold text-sm">Jawaban Salah. Lanjut ke soal berikutnya...</div>`;
            }

            setTimeout(nextSoal, 1500);
        }

        function nextSoal() {
            if (state.soalSaatIni < TOTAL_SOAL - 1) {
                state.soalSaatIni++;
                state.isJawabanDiberi = false;
                renderQuiz();
            } else {
                state.halaman = 'result';
                renderResult();
            }
        }

        function startTimer() {
            clearTimeout(state.timerTimeout);
            state.timerTimeout = setTimeout(() => {
                const feedbackArea = document.getElementById('feedback-area');
                if (feedbackArea) {
                    feedbackArea.innerHTML = `<div class="p-3 bg-amber-50 border border-amber-200 text-amber-700 rounded-xl font-bold text-sm">Waktu Habis! ⏰ Lanjut soal berikutnya...</div>`;
                }
                setTimeout(nextSoal, 1500);
            }, WAKTU_PER_SOAL * 1000);
        }

        function renderResult() {
            const app = document.getElementById('app');
            if (!app) return;

            const percentage = ((state.skor / TOTAL_SOAL) * 100).toFixed(1);
            const isLulus = state.skor >= (TOTAL_SOAL / 2);

            app.innerHTML = `
                <div class="max-w-xl mx-auto bg-white p-8 sm:p-10 rounded-3xl border border-slate-200 shadow-2xl text-center space-y-6">
                    <div class="w-20 h-20 mx-auto rounded-full ${isLulus ? 'bg-emerald-100 text-emerald-600' : 'bg-red-100 text-red-600'} flex items-center justify-center text-4xl">
                        <i class="${isLulus ? 'fa-solid fa-trophy' : 'fa-solid fa-circle-xmark'}"></i>
                    </div>

                    <div>
                        <h2 class="text-3xl font-extrabold ${isLulus ? 'text-emerald-600' : 'text-slate-800'}">
                            ${isLulus ? 'Selamat, Anda Lulus!' : 'Ujian Selesai'}
                        </h2>
                        <p class="text-sm text-slate-500 mt-1">Hasil Rekapitulasi Asesmen Hiragana (NIS: ${state.nis})</p>
                    </div>

                    <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100 space-y-2">
                        <div class="text-5xl font-extrabold text-red-500">${state.skor} / ${TOTAL_SOAL}</div>
                        <div class="text-sm font-bold text-slate-600">Jawaban Benar (${percentage}%)</div>
                    </div>

                    <button onclick="window.location.reload()" class="w-full py-4 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow-lg shadow-red-200 transition-all hover:scale-105 active:scale-95">
                        Kembali ke Halaman Utama
                    </button>
                </div>
            `;
        }

        function renderCheatingWarning() {
            const app = document.getElementById('app');
            if (!app) return;

            app.innerHTML = `
                <div class="max-w-md mx-auto bg-red-50 border-2 border-red-500 p-8 rounded-3xl text-center space-y-4">
                    <div class="text-5xl">⚠️</div>
                    <h2 class="text-2xl font-bold text-red-700">Asesmen Dibatalkan</h2>
                    <p class="text-xs text-red-600 leading-relaxed font-semibold">Anda terdeteksi meninggalkan halaman atau berpindah tab ujian. Demi integritas asesmen, sesi ujian dihentikan.</p>
                    <button onclick="window.location.reload()" class="px-6 py-3 bg-red-600 text-white font-bold rounded-xl shadow-md hover:bg-red-700 transition-all text-xs">
                        Ulangi Dari Awal
                    </button>
                </div>
            `;
        }

        // Anti-Cheating Handler
        window.addEventListener('blur', () => {
            if (state.activeTab === 'quiz' && state.halaman === 'quiz') {
                state.halaman = 'cheating';
                clearTimeout(state.timerTimeout);
                renderCheatingWarning();
            }
        });

        // Initial Load Event Listener
        document.addEventListener('DOMContentLoaded', () => {
            switchTab('table');
        });
    </script>
</body>
</html>
